[email_verification]
title = "Your Transat verification code"
subject = "🔐 Your Transat verification code: {{.VerificationCode}}"
code = "Your verification code: {{.VerificationCode}}"
instructions = "Enter your unique verification code: {{.VerificationCode}} in the Transat app"
expiration = "This code is valid for 10 minutes (until {{.VerificationCodeExpiration}}). If you don't have time to enter it, you can request a new one from the app."
signature = "Best regards,<br/>The Transat team"
footer = "Transat, the IMT Atlantique Nantes campus app for Atlantes, by Atlantes."
copyright = "© Plug'IMT all rights reserved (I think)"
intro = "🔐 Use your verification code now! 10 minutes to secure your access to Transat, the IMT Atlantique app. ⏳"

[email_new_signin]
title = "{{.FirstName}}, if you didn't sign in, change your password immediately!"
subject = "🐙 New sign-in to Transat"
header = "New sign-in to <span style=\"color:#ec7f32\">Transat</span>"
greeting = "Hi {{.FirstName}},"
message = "On {{.Date}} at {{.Time}}, we detected a <strong style=\"color:#0049a8\">new sign-in</strong> to your Transat account. <strong style=\"color:#0049a8\">If it was you, everything's fine</strong>, no need to panic. <strong>If not</strong>, we recommend you <strong style=\"color:#0049a8\">change your password <strong>immediately</strong></strong>."
signature = "Best regards,<br/>The Transat team"
footer = "Transat, the IMT Atlantique Nantes campus app for Atlantes, by Atlantes."
copyright = "© Plug'IMT all rights reserved (I think)"

[email_welcome]
title = "Transat, the ultimate app for every Atlante!"
subject = "☀️ Welcome to Transat, {{.FirstName}}! 🐙"
header = "Welcome {{.FirstName}}"
greeting = "Hellooooo {{.FirstName}},"
message = "Welcome to <strong style=\"color:#0049a8\">Transat</strong>, <strong>the ultimate app</strong> for every Atlante.\n\nWant to know what's happening on campus? <strong>Clubs, cafeteria menu, laundry machines...</strong> <strong style=\"color:#0049a8\">it's all here</strong> (almost).\n\nIn short, <strong>you made the right choice</strong>! Now, explore and enjoy."
signature = "See you soon on <strong>Transat</strong>"
footer = "Transat, the IMT Atlantique Nantes campus app for Atlantes, by Atlantes."
copyright = "© Plug'IMT all rights reserved (I think)"
laundry_title = "Waiting for <span style=\"color:#ec7f32\">laundry machines</span>? It's over!"
laundry_message = "Track their availability in real-time and get a notification before they're done to avoid unnecessary trips. Simple, efficient, <b>Transat</b> takes care of everything!"
ru_title = "Indecision at the <span style=\"color:#ec7f32\">cafeteria</span>? No more!"
ru_message = "Never know which line to join? Get the daily menu at 11am and plan your feast in the morning. With <b>Transat</b>, your stomach will thank you!"
future_title = "<span style=\"color:#ec7f32\">Transat</span>, this is just the beginning!"
future_message = "We're improving the app based on your feedback, and some awesome new features are coming very soon!\n\nBest regards,\nThe Transat team"

